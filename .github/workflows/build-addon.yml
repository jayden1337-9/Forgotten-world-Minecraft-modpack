name: Build Bedrock Add-on

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate pack assets and animation references
        run: python tools/validate_assets.py
      - name: Check JavaScript syntax
        run: node --check behavior_pack/scripts/main.js
      - name: Check VMOSCloud installer syntax
        run: bash -n tools/install-vmoscloud.sh
      - name: Package .mcaddon
        run: |
          mkdir -p dist/addon
          cd behavior_pack && zip -qr ../dist/addon/ForgottenWorld_BP.mcpack . && cd ..
          cd resource_pack && zip -qr ../dist/addon/ForgottenWorld_RP.mcpack . && cd ..
          cd dist/addon && zip -qr ../ForgottenWorld.mcaddon . && cd ../..
          cp README.md dist/README.txt
          cp tools/install-vmoscloud.sh dist/install-vmoscloud.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForgottenWorld-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/ForgottenWorld.mcaddon --generate-notes
