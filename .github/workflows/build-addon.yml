name: Build Bedrock Add-on

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate JSON and required files
        run: |
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path(".")
          files = list(root.glob("behavior_pack/**/*.json")) + list(root.glob("resource_pack/**/*.json")) + list(root.glob("config/**/*.json"))
          for path in files:
              json.loads(path.read_text())
          for path in ["behavior_pack/manifest.json", "resource_pack/manifest.json", "behavior_pack/scripts/main.js"]:
              assert (root / path).is_file(), f"Missing required file: {path}"
          print(f"Validated {len(files)} JSON files")
          PY
      - name: Package .mcaddon
        run: |
          mkdir -p dist/addon
          cd behavior_pack && zip -qr ../dist/addon/ForgottenWorld_BP.mcpack . && cd ..
          cd resource_pack && zip -qr ../dist/addon/ForgottenWorld_RP.mcpack . && cd ..
          cd dist/addon && zip -qr ../ForgottenWorld.mcaddon . && cd ../..
          cp README.md dist/README.txt
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForgottenWorld-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/ForgottenWorld.mcaddon --generate-notes
